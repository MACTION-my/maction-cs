  - variable: FIREBASE_AUTH_DOMAIN
    value: maction-cs.firebaseapp.com

  - variable: FIREBASE_WEB_API_KEY
    value: AIzaSyDmv9JwuKI2PRWWt-UcA3THBNuy5vIvW-c
    availability: [ RUNTIME ]

  - variable: CRM_ORIGIN
    value: https://maction-cs--maction-cs.asia-east1.hosted.app
    availability: [ RUNTIME ]
  - variable: META_APP_SECRET
    secret: META_APP_SECRET
  - variable: META_VERIFY_TOKEN
    secret: META_VERIFY_TOKEN
